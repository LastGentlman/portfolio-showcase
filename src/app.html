<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>IngRoy | Software Engineering Showcase & Portfolio</title>
		<meta name="description" content="High-impact engineering portfolio showcasing full-stack platforms, distributed systems, developer tools, and cloud architectures." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<script>
			(function() {
				try {
					const saved = localStorage.getItem('theme');
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (saved === 'dark' || (!saved && prefersDark)) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white dark:bg-black text-zinc-900 dark:text-zinc-100 min-h-screen selection:bg-zinc-200 dark:selection:bg-zinc-800 antialiased transition-colors duration-150">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
